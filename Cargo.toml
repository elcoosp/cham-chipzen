[package]
name = "cham-chipzen"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Chipzen External-API poker bot driven by the CHAMELEON HUNL agent (Rust port of the chipzen-sdk external-api-bot reference)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/elcoosp/cham-chipzen"
homepage = "https://github.com/elcoosp/cham-chipzen"
documentation = "https://docs.rs/cham-chipzen"
keywords = ["poker", "chipzen", "hulhe", "bot", "chameleon"]
categories = ["games", "network-programming"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
url = "2"

# ——— CHAMELEON workspace crates (path deps; point CHIPZEN_CHAM_ROOT at the
#     chameleon checkout if you vendor this crate elsewhere) ———
cham-core = { path = "../chameleon/crates/cham-core" }
cham-agent = { path = "../chameleon/crates/cham-agent" }
cham-router = { path = "../chameleon/crates/cham-router" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

[profile.release]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Do not panic on unreachable branches silently; require explicit intent.
# `expect_used` is *not* enforced because `Frame::raw` defaults and
# test-only code legitimately unwrap.
