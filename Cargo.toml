[package]
name = "cham-chipzen"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Chipzen External-API poker bot driven by the CHAMELEON HUNL agent (Rust port of the chipzen-sdk external-api-bot reference)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/elcoosp/cham-chipzen"
homepage = "https://github.com/elcoosp/cham-chipzen"
documentation = "https://docs.rs/cham-chipzen"
keywords = ["poker", "chipzen", "hulhe", "bot", "chameleon"]
categories = ["games", "network-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
url = "2"

# ——— CHAMELEON workspace crates (path deps; point CHIPZEN_CHAM_ROOT at the
#     chameleon checkout if you vendor this crate elsewhere) ———
cham-core = { path = "../chameleon/crates/cham-core" }
cham-agent = { path = "../chameleon/crates/cham-agent" }
cham-router = { path = "../chameleon/crates/cham-router" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

[profile.release]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Note on `panic`/`todo`/`unimplemented`/`unreachable`: these are enforced in
# library and binary code but NOT in `tests/` or `#[cfg(test)]` modules, where
# panicking is the idiomatic way to signal a test failure. Rather than adding
# `#[allow(clippy::panic)]` to every test, we enforce them per-module via
# `#[deny(...)]` attributes in `src/` where they matter.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# `.unwrap()`/`.expect()` are still permitted — many call sites are
# provably-infallible (`serde_json::to_string` on a `Value` we built) and
# forcing `Result` plumbing would obscure the protocol contract. Tracked
# as a future cleanup; see the README's "Tracked gaps".
# --- correctness / style signals we do want as warnings ---
debug_assert_with_mut_call = "warn"
exit = "warn"
wildcard_imports = "warn"
